# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Change the following value to '/PROJECT_NAME' ONLY IF your site type is GitHub Pages Project sites
# and doesn't have a custom domain.
baseurl: ""

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: vi-VN

# Change to your timezone › http://www.timezoneconverter.com/cgi-bin/findzone/findzone
timezone: Asia/Ho_Chi_Minh

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: el pulga

tagline: Blog kỹ thuật & writeup

description: >-
  Ghi chép về Git, Linux, cách đọc dữ liệu và những điều học được khi tự làm lại một bài thực hành.

# fill in the protocol & hostname for your site, e.g., 'https://username.github.io'
url: ""

github:
  username: # change to your github username

twitter:
  username: # change to your twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: el pulga
  email: # Optional contact address
  links: [] # Optional public profile URLs

google_site_verification: # fill in to your verification string

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

google_analytics:
  id: # fill in your Google Analytics ID
  # Google Analytics pageviews report settings
  pv:
    proxy_endpoint: # fill in the Google Analytics superProxy endpoint of Google App Engine
    cache_path: # the local PV cache data, friendly to visitors from GFW region

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light  - Use the light color scheme
#     dark   - Use the dark color scheme
#
theme_mode: # [light|dark]

# The CDN endpoint for images.
# Notice that once it is assigned, the CDN url
# will be added to all image (site avatar & posts' images) paths starting with '/'
#
# e.g. 'https://cdn.com'
img_cdn: 

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/el-pulga.png

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  active: # The global switch for posts comments, e.g., 'disqus'.  Keep it empty means disable
  # The active options are as follows:
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances settings › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus options › https://giscus.app
  giscus:
    repo: # <gh-username>/<repo>
    repo_id:
    category:
    category_id:
    mapping: # optional, default to 'pathname'
    input_position: top # optional, default to 'bottom'
    lang: # optional, default to the value of `site.lang`
    reactions_enabled: # optional, default to the value of `1`

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development|production]

pwa:
  enabled: true # the option for PWA feature

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true
  - scope:
      path: assets/js/dist
    values:
      swcache: true

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - dyl4n.png
  - "$APPDATA"
  # Keep the template author's Markdown in the repository, outside the published blog.
  - _posts/2023-03-01-hello-world.md
  - _posts/2023-03-03-bandit-writeup.md
  - _posts/2023-03-05-linux-commands.md
  - _posts/2023-03-05-linux-file-system-hierarchy.md
  - _posts/2023-03-06-find-command-linux.md
  - _posts/2023-03-10-file-types-linux.md
  - _posts/2023-04-19-sqlmap.md
  - _posts/2023-04-21-nmap-network-scanner.md
  - _posts/2023-07-22-the-planets-mercury-writeup-vulnhub.md
  - _posts/2023-07-23-the-planets-earth-writeup-vulnhub.md
  - _posts/2023-07-25-pwned-1-writeup-vulnhub.md
  - _posts/2023-07-28-healthcare-writeup-vulnhub.md
  - _posts/2023-07-31-devguru-writeup-vulnhub.md
  - _posts/2023-08-01-baby-logger-middleware-writeup-cookie-arena.md
  - _posts/2023-08-01-logger-middleware-writeup-cookie-arena.md
  - _posts/2023-08-04-empire-lupinone-writeup-vulnhub.md
  - _posts/2023-08-22-bizarre-adventure-mrr3b0t-writeup-vulnhub.md
  - _posts/2023-11-15-writeup-neonify-cookie-arena.md
  - _posts/2023-11-15-writeup-the-jwt-algorithm-cookie-arena.md
  - _posts/2023-11-21-sau-htb-writeup-hackthebox.md
  - _posts/2024-01-26-cozyhosting-writeup-hackthebox.md
  - _posts/2024-07-10-writeup-baby-sql-injection-to-rce-cookie-arena.md
  - _posts/2024-07-11-writeup-baby-assert-cookie-arena.md
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - rollup.config.js
  - node_modules
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

